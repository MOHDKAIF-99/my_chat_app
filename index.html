<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Chat Room</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/wavesurfer.js@7"></script>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <h2>Secure Chat Room</h2>

      <div class="join-form">
        <div class="avatar-picker" id="avatar-picker" title="Click to view & edit profile">
          <img id="avatar-preview" src="" alt="Avatar">
          <input type="file" id="avatar-input" accept="image/*" style="display: none;">
        </div>
        <input type="text" id="username" placeholder="Username">
        <input type="text" id="room" placeholder="Room ID">
        <button id="join-btn">Join Room</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="message-wrapper">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=System" class="avatar-img" alt="System">
        <div class="message">
          <div class="author">System</div>
          <div>Welcome! Enter a Room ID and click Join Room to start chatting.</div>
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="message-input" placeholder="Type a message...">
      <input type="file" id="file-input" accept="image/*,video/*,audio/*" style="display: none;">
      <button onclick="document.getElementById('file-input').click()" class="icon-btn" title="Attach File">📎</button>
      <button id="mic-btn" class="icon-btn" title="Record Voice Message">🎤</button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal">
    <div class="profile-card">
      <span class="modal-close" id="profile-modal-close">&times;</span>
      <h3>Profile Options</h3>
      <div class="profile-avatar-wrapper">
        <img id="profile-modal-img" src="" alt="Profile Picture">
        <button id="change-avatar-btn">📷 Change Photo</button>
      </div>
      <div class="profile-input-group">
        <label for="profile-username-input">Username</label>
        <input type="text" id="profile-username-input" placeholder="Enter username">
      </div>
      <button id="save-profile-btn">Save Profile</button>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="image-modal" class="modal">
    <span class="modal-close" id="modal-close">&times;</span>
    <img id="modal-img" src="" alt="Full size preview">
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const usernameInput = document.getElementById('username');
    const roomInput = document.getElementById('room');
    const joinBtn = document.getElementById('join-btn');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const micBtn = document.getElementById('mic-btn');
    const chatMessages = document.getElementById('chat-messages');

    const avatarPicker = document.getElementById('avatar-picker');
    const avatarPreview = document.getElementById('avatar-preview');
    const avatarInput = document.getElementById('avatar-input');
    
    const profileModal = document.getElementById('profile-modal');
    const profileModalClose = document.getElementById('profile-modal-close');
    const profileModalImg = document.getElementById('profile-modal-img');
    const profileUsernameInput = document.getElementById('profile-username-input');
    const changeAvatarBtn = document.getElementById('change-avatar-btn');
    const saveProfileBtn = document.getElementById('save-profile-btn');

    let currentAvatar = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + Math.floor(Math.random() * 10000);
    let tempAvatar = currentAvatar;
    avatarPreview.src = currentAvatar;

    let currentRoom = '';
    let currentUsername = 'Anonymous';

    let mediaRecorder, audioChunks = [], isRecording = false;

    // Helper: Auto-Join Room if not explicitly joined
    function ensureRoomJoined() {
      if (!socket.connected) {
        alert('Not connected to server. Please check internet connection.');
        return false;
      }
      currentUsername = usernameInput.value.trim() || currentUsername;
      const typedRoom = roomInput.value.trim();

      if (!currentRoom && typedRoom) {
        currentRoom = typedRoom;
        socket.emit('join_room', { room: currentRoom, username: currentUsername });
      } else if (!currentRoom && !typedRoom) {
        alert('Please enter a Room ID and click Join Room first!');
        return false;
      }
      return true;
    }

    // Profile Modal
    avatarPicker.onclick = () => {
      tempAvatar = currentAvatar;
      profileModalImg.src = currentAvatar;
      profileUsernameInput.value = usernameInput.value || currentUsername;
      profileModal.style.display = 'flex';
    };

    profileModalClose.onclick = () => profileModal.style.display = 'none';
    changeAvatarBtn.onclick = () => avatarInput.click();

    avatarInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          tempAvatar = reader.result;
          profileModalImg.src = tempAvatar;
        };
        reader.readAsDataURL(file);
      }
    };

    saveProfileBtn.onclick = () => {
      currentAvatar = tempAvatar;
      avatarPreview.src = currentAvatar;
      
      const newUsername = profileUsernameInput.value.trim();
      if (newUsername) {
        currentUsername = newUsername;
        usernameInput.value = currentUsername;
      }
      profileModal.style.display = 'none';
    };

    usernameInput.oninput = () => { currentUsername = usernameInput.value.trim(); };

    // Join Room Button
    joinBtn.onclick = () => {
      currentUsername = usernameInput.value.trim() || 'Anonymous';
      currentRoom = roomInput.value.trim();

      if (currentRoom) {
        socket.emit('join_room', { room: currentRoom, username: currentUsername });
        alert(`Joined Room: ${currentRoom}`);
      } else {
        alert('Please enter a Room ID first.');
      }
    };

    socket.on('user_online', (data) => {
      const notification = document.createElement('div');
      notification.className = 'system-notification';
      notification.innerHTML = `🟢 <strong>${data.username}</strong> is now online (${data.time})`;
      chatMessages.appendChild(notification);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // Send Text Message
    sendBtn.onclick = () => {
      if (!ensureRoomJoined()) return;

      const text = messageInput.value.trim();
      if (text) {
        socket.emit('send_message', {
          room: currentRoom,
          author: currentUsername,
          avatar: currentAvatar,
          type: 'text',
          content: text
        });
        messageInput.value = '';
      }
    };

    messageInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

    // Send File Attachment
    fileInput.onchange = (e) => {
      if (!ensureRoomJoined()) return;

      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 50 * 1024 * 1024) {
        alert('File size is too large! Maximum limit is 50 MB.');
        fileInput.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        socket.emit('send_message', {
          room: currentRoom,
          author: currentUsername,
          avatar: currentAvatar,
          type: 'file',
          fileType: file.type,
          content: reader.result
        });
      };
      reader.readAsDataURL(file);
      fileInput.value = '';
    };

    // Voice Message Handler
    micBtn.onclick = async () => {
      if (!ensureRoomJoined()) return;

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const reader = new FileReader();
            reader.onload = () => {
              socket.emit('send_message', {
                room: currentRoom,
                author: currentUsername,
                avatar: currentAvatar,
                type: 'voice',
                content: reader.result
              });
            };
            reader.readAsDataURL(new Blob(audioChunks, { type: 'audio/webm' }));
            stream.getTracks().forEach(t => t.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
          micBtn.innerText = '🛑';
        } catch (err) {
          alert('Microphone permission denied or unsupported.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.innerText = '🎤';
      }
    };

    // Message Receiver
    socket.on('receive_message', (data) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';
      wrapper.innerHTML = `
        <img src="${data.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=Anon'}" class="avatar-img">
        <div class="message">
          <div class="author">${data.author}</div>
        </div>
      `;
      const msgDiv = wrapper.querySelector('.message');

      if (data.type === 'text') {
        const textNode = document.createElement('div');
        textNode.innerText = data.content;
        msgDiv.appendChild(textNode);
      } else if (data.type === 'file') {
        if (data.fileType.startsWith('image/')) {
          msgDiv.innerHTML += `<img src="${data.content}" alt="Attachment">`;
        } else if (data.fileType.startsWith('video/')) {
          msgDiv.innerHTML += `<video controls playsinline src="${data.content}"></video>`;
        } else {
          msgDiv.innerHTML += `<a href="${data.content}" download="file">📥 Download Attachment</a>`;
        }
      } else if (data.type === 'voice') {
        const id = 'wave-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        msgDiv.innerHTML += `
          <div class="voice-note-card">
            <div class="voice-header">🎙️ Voice Note</div>
            <div class="voice-body">
              <button class="play-voice-btn icon-only" id="btn-${id}">▶</button>
              <div id="${id}" class="waveform-container"></div>
              <button class="speed-voice-btn" id="speed-${id}">1x</button>
            </div>
          </div>
        `;

        setTimeout(() => {
          const ws = WaveSurfer.create({
            container: `#${id}`,
            waveColor: '#475569',
            progressColor: '#10b981',
            cursorColor: '#38bdf8',
            barWidth: 2,
            height: 35,
            url: data.content
          });

          const btn = document.getElementById(`btn-${id}`);
          btn.onclick = () => ws.playPause();
          ws.on('play', () => btn.innerText = '⏸');
          ws.on('pause', () => btn.innerText = '▶');
          ws.on('finish', () => btn.innerText = '▶');

          const speedBtn = document.getElementById(`speed-${id}`);
          const speeds = [1, 1.25, 1.5, 2];
          let speedIndex = 0;

          speedBtn.onclick = () => {
            speedIndex = (speedIndex + 1) % speeds.length;
            const newSpeed = speeds[speedIndex];
            ws.setPlaybackRate(newSpeed);
            speedBtn.innerText = `${newSpeed}x`;
          };
        }, 50);
      }

      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // Lightbox
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    document.getElementById('modal-close').onclick = () => modal.style.display = 'none';
    chatMessages.onclick = (e) => {
      if (e.target.tagName === 'IMG' && !e.target.classList.contains('avatar-img')) {
        modal.style.display = 'flex';
        modalImg.src = e.target.src;
      }
    };
  </script>
</body>
</html>
