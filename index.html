<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp E2EE Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Join / Encryption Setup Screen -->
  <div id="join-overlay">
    <div class="join-card">
      <h2>🔒 E2EE Chat Setup</h2>
      <p>Enter your username and a shared secret key to generate your encryption key.</p>
      <input type="text" id="username-input" placeholder="Your Name (e.g., Kaif)">
      <input type="password" id="key-input" placeholder="Secret Key (e.g., Room123Key)">
      <button id="join-btn">Enter Secure Chat</button>
    </div>
  </div>

  <!-- Main WhatsApp Chat UI -->
  <div id="chat-container" style="display: none;">
    <div class="chat-header">
      <div>
        <h2>🔒 Encrypted Room</h2>
        <span class="status">● Connected</span>
      </div>
      <span id="current-user-tag"></span>
    </div>

    <div id="messages"></div>

    <div id="input-container">
      <input type="file" id="image-input" accept="image/*" style="display:none;">
      <button id="image-btn" class="action-btn" title="Send Image">📷</button>
      <button id="record-btn" class="action-btn" title="Record Voice">🎙️</button>

      <input type="text" id="message-input" placeholder="Type a message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let cryptoKey = null;
    let myUsername = "Anonymous";

    async function initKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      cryptoKey = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: enc.encode("fixed-salt-1234"),
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text) {
      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        cryptoKey,
        enc.encode(text)
      );
      return { cipherText: Array.from(new Uint8Array(encrypted)), iv: Array.from(iv) };
    }

    async function decryptData(encryptedObj) {
      const dec = new TextDecoder();
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: new Uint8Array(encryptedObj.iv) },
        cryptoKey,
        new Uint8Array(encryptedObj.cipherText)
      );
      return dec.decode(decrypted);
    }

    // Modal Setup
    const joinOverlay = document.getElementById('join-overlay');
    const chatContainer = document.getElementById('chat-container');
    const usernameInput = document.getElementById('username-input');
    const keyInput = document.getElementById('key-input');
    const joinBtn = document.getElementById('join-btn');
    const currentUserTag = document.getElementById('current-user-tag');

    joinBtn.addEventListener('click', async () => {
      const name = usernameInput.value.trim();
      const pass = keyInput.value.trim();
      if (!name || !pass) {
        alert("Please enter both Username and Secret Key!");
        return;
      }
      myUsername = name;
      await initKey(pass);
      joinOverlay.style.display = 'none';
      chatContainer.style.display = 'flex';
      currentUserTag.innerText = `Logged in as: ${myUsername}`;
    });

    // Chat Logic
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const imageBtn = document.getElementById('image-btn');
    const imageInput = document.getElementById('image-input');
    const recordBtn = document.getElementById('record-btn');

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      const payload = JSON.stringify({ type: 'text', content: text, senderId: socket.id, senderName: myUsername });
      const encrypted = await encryptData(payload);
      socket.emit('sendMessage', encrypted);
      messageInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    imageBtn.addEventListener('click', () => imageInput.click());
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const payload = JSON.stringify({ type: 'image', content: e.target.result, senderId: socket.id, senderName: myUsername });
          const encrypted = await encryptData(payload);
          socket.emit('sendMessage', encrypted);
        };
        reader.readAsDataURL(file);
      }
    });

    let mediaRecorder, audioChunks = [], isRecording = false;
    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          let mimeType = 'audio/webm;codecs=opus';
          if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'audio/ogg;codecs=opus';

          mediaRecorder = new MediaRecorder(stream, { mimeType });
          audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
              const payload = JSON.stringify({ type: 'audio', content: reader.result, senderId: socket.id, senderName: myUsername });
              const encrypted = await encryptData(payload);
              socket.emit('sendMessage', encrypted);
            };
            stream.getTracks().forEach(t => t.stop());
          };

          mediaRecorder.start(1000);
          isRecording = true;
          recordBtn.innerText = '⏹️';
          recordBtn.classList.add('recording');
        } catch (err) {
          alert('Microphone permission required!');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = '🎙️';
        recordBtn.classList.remove('recording');
      }
    });

    socket.on('receiveMessage', async (encryptedData) => {
      try {
        const decryptedJson = await decryptData(encryptedData);
        const data = JSON.parse(decryptedJson);

        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message-bubble');

        const nameSpan = document.createElement('div');
        nameSpan.classList.add('sender-name');
        nameSpan.innerText = data.senderName || 'Anonymous';

        if (data.senderId === socket.id) {
          msgDiv.classList.add('sent');
          nameSpan.innerText = 'You';
        } else {
          msgDiv.classList.add('received');
        }

        msgDiv.appendChild(nameSpan);

        if (data.type === 'text') {
          const textSpan = document.createElement('div');
          textSpan.innerText = data.content;
          msgDiv.appendChild(textSpan);
        } else if (data.type === 'image') {
          const img = document.createElement('img');
          img.src = data.content;
          msgDiv.appendChild(img);
        } else if (data.type === 'audio') {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = data.content;
          msgDiv.appendChild(audio);
        }

        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      } catch (e) {
        const errorDiv = document.createElement('div');
        errorDiv.classList.add('message-bubble', 'received');
        errorDiv.style.fontStyle = 'italic';
        errorDiv.style.color = '#777';
        errorDiv.innerText = '🔒 [Encrypted Message - Key Mismatch]';
        messagesDiv.appendChild(errorDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }
    });
  </script>
</body>
</html>
