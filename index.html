<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> end-to-end encryption chat room </title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-box { border: 1px solid #ccc; height: 350px; width: 400px; padding: 10px; overflow-y: auto; margin-bottom: 10px; border-radius: 5px; }
    input, button { padding: 8px; margin-right: 5px; margin-bottom: 5px; }
    .system-msg { color: #888; font-style: italic; }
    img, video { max-width: 250px; border-radius: 8px; margin-top: 5px; display: block; }
    audio { margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <h2> Secure Chat Room</h2>

  <!-- Room Setup -->
  <div>
    <input type="text" id="username-input" placeholder="Your Name">
    <input type="text" id="room-input" placeholder="Secret Room Key">
    <button id="join-btn">Join Room</button>
  </div>

  <hr style="margin: 15px 0;">

  <!-- Messages Window -->
  <div id="chat-box"></div>

  <!-- Send Controls -->
  <div>
    <input type="text" id="message-input" placeholder="Type a message..." disabled>
    <button id="send-btn" disabled>Send</button>
    
    <br><br>

    <!-- Media Controls -->
    <button id="record-btn" disabled>🎤 Start Recording</button>
    <label for="file-input" style="font-size: 14px; font-weight: bold;">📁 Send Picture/Video:</label>
    <input type="file" id="file-input" accept="image/*,video/*" disabled>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const usernameInput = document.getElementById('username-input');
    const roomInput = document.getElementById('room-input');
    const joinBtn = document.getElementById('join-btn');
    const sendBtn = document.getElementById('send-btn');
    const messageInput = document.getElementById('message-input');
    const chatBox = document.getElementById('chat-box');
    const recordBtn = document.getElementById('record-btn');
    const fileInput = document.getElementById('file-input');

    let currentRoom = "";
    let username = "";
    let mediaRecorder;
    let audioChunks = [];

    // Join room
    joinBtn.addEventListener('click', () => {
      currentRoom = roomInput.value.trim();
      username = usernameInput.value.trim() || 'Anonymous';

      if (currentRoom !== "") {
        socket.emit('joinRoom', currentRoom);
        
        // Enable UI
        messageInput.disabled = false;
        sendBtn.disabled = false;
        recordBtn.disabled = false;
        fileInput.disabled = false;
        
        roomInput.disabled = true;
        usernameInput.disabled = true;
        joinBtn.disabled = true;

        chatBox.innerHTML += `<p class="system-msg">Joined Room: <b>${currentRoom}</b></p>`;
      }
    });

    // Send Text Message
    function sendTextMessage() {
      const text = messageInput.value.trim();
      if (text !== "" && currentRoom !== "") {
        socket.emit('sendMessage', {
          roomId: currentRoom,
          sender: username,
          type: 'text',
          content: text
        });
        messageInput.value = "";
      }
    }

    // Trigger send on click
    sendBtn.addEventListener('click', sendTextMessage);

    // Trigger send when pressing Enter key
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendTextMessage();
      }
    });

    // Send Image or Video
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file || !currentRoom) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        let fileType = 'file';
        if (file.type.startsWith('image/')) fileType = 'image';
        if (file.type.startsWith('video/')) fileType = 'video';

        socket.emit('sendMessage', {
          roomId: currentRoom,
          sender: username,
          type: fileType,
          content: reader.result
        });
        fileInput.value = ''; 
      };
    });

    // Record & Send Voice Message
    recordBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob);
          reader.onloadend = () => {
            socket.emit('sendMessage', {
              roomId: currentRoom,
              sender: username,
              type: 'audio',
              content: reader.result
            });
          };
        };

        mediaRecorder.start();
        recordBtn.innerText = '⏹️ Stop & Send Voice';
        recordBtn.style.background = '#ff8888';
      } else {
        mediaRecorder.stop();
        recordBtn.innerText = '🎤 Start Recording';
        recordBtn.style.background = '';
      }
    });

    // Display Incoming Messages
    socket.on('receiveMessage', (data) => {
      let htmlContent = '';

      if (data.type === 'text') {
        htmlContent = `<span>${data.content}</span>`;
      } else if (data.type === 'image') {
        htmlContent = `<img src="${data.content}" alt="Image">`;
      } else if (data.type === 'video') {
        htmlContent = `<video src="${data.content}" controls></video>`;
      } else if (data.type === 'audio') {
        htmlContent = `<audio src="${data.content}" controls></audio>`;
      }

      chatBox.innerHTML += `<p><b>${data.sender}:</b> ${htmlContent}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>

</body>
</html>
